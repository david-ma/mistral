            background: linear-gradient(135deg, #ffe4af 0%, #ffc107 100%);

      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body selection:bg-primary selection:text-on-primary-fixed overflow-x-hidden">

<header class="flex justify-between items-center px-6 py-4 w-full sticky top-0 z-50 bg-[#131313]/80 backdrop-blur-xl shadow-[0px_20px_40px_rgba(250,189,0,0.06)]">

<div class="flex items-center gap-4 text-[#FFC107]">
<button class="scale-95 active:scale-90 transition-transform">

</button>

</button>

</header>

<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary/10 rounded-full blur-[80px]"></div>
<div class="relative z-10 flex flex-col items-center text-center space-y-6">
<div class="w-20 h-20 rounded-full bg-tertiary/10 flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-tertiary text-4xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="space-y-2">
<h2 class="font-headline font-bold text-3xl tracking-tight text-primary">Nice shot!</h2>
<p class="text-on-surface-variant font-medium">Analyzing your entry...</p>
</div>
<!-- Analyzing Indicator (Custom Bento Style) -->
<div class="w-full grid grid-cols-2 gap-3 mt-4">
<div class="bg-surface-container-highest p-4 rounded-xl flex flex-col items-start gap-2">
<span class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold">Metadata</span>
<div class="h-1 w-full bg-surface-container-low rounded-full overflow-hidden">
<div class="h-full bg-tertiary w-3/4"></div>
</div>
</div>
<div class="bg-surface-container-highest p-4 rounded-xl flex flex-col items-start gap-2">
<span class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold">AI Verify</span>
<div class="h-1 w-full bg-surface-container-low rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/2"></div>
</div>
</div>
</div>
</div>
</section>

<section class="w-full max-w-2xl text-center space-y-12">
<!-- Celebratory Graphic -->
<div class="relative inline-block">
<div class="absolute inset-0 bg-tertiary blur-[120px] opacity-20 animate-pulse"></div>
<div class="relative bg-surface-container-high rounded-3xl p-1 overflow-hidden">
<img alt="Cinematic shot of a winning camera lens" class="w-full aspect-video object-cover rounded-[1.4rem] opacity-80 grayscale hover:grayscale-0 transition-all duration-700" data-alt="Cinematic shot of a high-end camera lens with neon reflections" src="https://lh3.googleusercontent.com/aida-public/AB6AXuChOq1ccItmkzojhslbUyaS3I2ohxKXgT2BelgYxyrNyVm6xfvYhG8wvqTIK8hHNvGQTlQvqOEcp1tMljSO2btzxgasvxvPXLyAehmzyyzKiRnD9sVK74yeBtbj-XvBf3wWht_Blle3Rpj7Xvi3h4Zoahyh4nIlWhbT5VhuokKmn8UsqbOsTKjjAhETK1-tFIXRw94o21jb3G3rf2lveePOEPaCbnZ_nwVIQ5bhSJWJTMOTwnDGkWReaRGCkiBpUJWhTWJM7qYH-oc"/>
<div class="absolute bottom-6 left-6 flex items-center gap-3">
<div class="bg-tertiary text-on-tertiary px-4 py-1 rounded-full font-headline font-black text-sm tracking-tighter uppercase">COMPLETED</div>
</div>
</div>
</div>
<!-- Summary Text -->

<h1 class="font-headline font-black text-6xl md:text-8xl text-white tracking-tighter uppercase leading-none">

</h1>
<div class="flex items-center justify-center gap-4 py-6">
<div class="flex flex-col items-center">
<span class="font-headline text-5xl font-black text-primary">10</span>
<span class="text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant">OF 10 Prompts</span>
</div>
<div class="h-12 w-[1px] bg-outline-variant/30"></div>
<div class="flex flex-col items-center">
<span class="font-headline text-5xl font-black text-on-surface">1.2k</span>
<span class="text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant">Points Earned</span>
</div>
</div>
</div>
<!-- Kinetic CTAs -->
<div class="flex flex-col gap-4 max-w-sm mx-auto">
<button class="editorial-gradient text-on-primary-fixed h-16 rounded-full font-headline font-black text-lg uppercase tracking-widest scale-100 hover:scale-[1.02] active:scale-95 transition-all shadow-[0px_20px_40px_rgba(250,189,0,0.2)]">
                    View My Card
                </button>
<button class="bg-surface-container-highest text-on-surface h-16 rounded-full font-headline font-bold text-sm uppercase tracking-widest hover:bg-surface-bright transition-colors">

</div>

<span class="font-['Inter'] text-[10px] font-bold uppercase tracking-wider">Hunt</span>
