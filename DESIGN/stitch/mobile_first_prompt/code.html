<body class="bg-background text-on-surface font-body min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-[#0a0e14] text-[#a2c9ff] flex items-center justify-between px-4 h-14 w-full z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#a2c9ff]" data-icon="target">target</span>
<h1 class="font-['Inter'] font-semibold tracking-tight text-lg text-[#a2c9ff] font-bold tracking-tighter">Hunt Active</h1>
</div>
<button class="p-2 hover:bg-[#16202e] transition-colors duration-150 ease-in-out">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Progress Tracker -->
<div class="w-full bg-surface-container-low px-4 py-3 flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="text-[0.6875rem] uppercase tracking-[0.05em] font-medium text-on-surface-variant">Active Hunt</span>
<span class="text-[0.6875rem] uppercase tracking-[0.05em] font-medium text-primary">0 / 12</span>
</div>
<div class="w-full h-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary w-0"></div>
</div>

<div class="bg-surface-container rounded-lg border border-outline-variant/20 p-6 flex flex-col gap-8 flex-grow justify-center">
<div class="flex flex-col gap-2">
<span class="text-[0.6875rem] uppercase tracking-[0.05em] font-medium text-primary">Mission 01</span>
<h2 class="text-2xl font-bold tracking-tight text-on-surface leading-tight">Capture a neon sign reflecting in a puddle</h2>
</div>
<!-- Visual Hint/Asset -->
<div class="aspect-square w-full bg-surface-container-low rounded-lg relative overflow-hidden flex items-center justify-center">
<div class="absolute inset-0 opacity-20 bg-center bg-cover" data-alt="Dark street puddle with neon light reflections" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAsG-SifLpmuqV5CQICOQNFNyxZNzVE6UAE8IhpwyhPTcKQkmEnpsifuJcKVJJ0gTkVvza5Uod-UFRUKeRQ8x1I6Zxz3qK5gdCCTkIgXO9kcMlkWkzACwdaUOZV3GqCjnIrOY5jdWAT82I0mV8j_PlYnW_wqnuNkjciqiCcfTlBScjmo0U8_aokhpTJD5hiD-505GBgr2cHzSaLFU3KIWi0XeYx8fZpqTZREYy7zfCENFok8A17iSS6JjwFscGZMaTP4ukTONqMqTc')"></div>
<div class="z-10 flex flex-col items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-4xl" data-icon="image_search">image_search</span>
<span class="text-xs font-medium uppercase tracking-widest">Awaiting Capture</span>
</div>
</div>
<!-- Action Area -->
<div class="flex flex-col gap-3">
<button class="bg-primary text-on-primary h-14 rounded-lg font-bold uppercase tracking-wider flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined" data-icon="camera" style="font-variation-settings: 'FILL' 1;">camera</span>
                    Launch Camera
                </button>
<button class="bg-transparent border border-outline text-on-surface h-12 rounded-lg font-medium text-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="help">help</span>
                    View Examples
                </button>
</div>
</div>

<div class="grid grid-cols-2 gap-3">
<div class="bg-surface-container-low p-4 rounded-lg flex flex-col gap-1">
<span class="text-[0.625rem] uppercase tracking-wider text-on-surface-variant">Current Difficulty</span>
<span class="text-sm font-semibold text-on-surface">Standard</span>
</div>
<div class="bg-surface-container-low p-4 rounded-lg flex flex-col gap-1">
<span class="text-[0.625rem] uppercase tracking-wider text-on-surface-variant">XP Potential</span>
<span class="text-sm font-semibold text-primary">+150 PTS</span>
</div>
