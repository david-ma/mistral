<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .zine-shadow {
            box-shadow: 8px 8px 0px 0px rgba(0, 106, 60, 1);
        }
        .zine-shadow-pink {
            box-shadow: 8px 8px 0px 0px rgba(115, 81, 102, 1);
        }
        .sticker-border {
            border: 3px solid #2d2f2d;
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background font-body text-on-background min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar suppressed for Transactional Flow (Signup) -->
<main class="flex-grow flex flex-col items-center justify-center px-6 py-12 relative">
<!-- Background Decorations -->
<div class="absolute top-10 left-[-2rem] -rotate-12 opacity-20 hidden md:block">
<img alt="Cute frog illustration" class="w-48 h-48" data-alt="Cartoon green frog sitting on lilypad" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDo8DYLfNOJfLmN2IFXGnlrX3zmMKmTyLVcxc5y_vfc-ivlyVrjTerMWj4EDv65Feg1yk6_UnFqRgpkNfBscZ1Z5mGE7ki5J7Tftb0x0utf8xSkeq8ceiPkLpccc5DAVTQg-OeGPfdiAGwB1-NcqJigW6803E7J5BqeYno4yUze7kTLSpwszonJksyP2oi8SyMA_fPKsGGGo8yPip-x4TklVC0x5hMX8eq5wHmD3uJsoPUwXgx3UH08OOmV-Wygo9Ho-xCjdZpiJ7s"/>
</div>
<div class="absolute bottom-10 right-[-2rem] rotate-12 opacity-20 hidden md:block">
<img alt="Cute frog illustration" class="w-48 h-48" data-alt="Happy cartoon frog jumping upwards" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6ocP-00TtB7-vnyMtDrk3y_8PfWgqxkT1D4XJheVuB2QYMwxGE71G46nq8OpKvrcvu1gS9bAALyTEtnSjbHwX6SlyoK8jPgIoEVM-OaG2iMgHoMn5x20MM-JU7sSCQz8Z8K_3uDw4aFbBzQasmX_nCUN8gQ7pzJxhcJQ5VDPlbCSNr1ooEwNwFeoiOJPFBjvbmhJnfV6TsRpWbIxM2DwgaJoTPTxpO12SflZ6Y_QQ05_I5mQEgK4l_EcatlWht5J-x5j3TVtpu6E"/>
</div>
<!-- Scrapbook Header Layout -->
<div class="relative mb-12 text-center">
<div class="absolute -inset-4 bg-primary-fixed-dim rounded-xl -rotate-2 -z-10"></div>
<h1 class="font-headline text-4xl md:text-6xl font-extrabold text-on-primary-fixed tracking-tight leading-none px-4">
                Don't hop away!
            </h1>
</div>
<!-- Signup Card -->
<div class="w-full max-w-md bg-secondary-fixed p-8 rounded-xl zine-shadow-pink border-4 border-secondary border-opacity-20 relative">
<!-- Floating Accessory -->
<div class="absolute -top-6 -right-6 bg-tertiary-fixed sticker-border p-3 rounded-full rotate-12 shadow-md">
<span class="material-symbols-outlined text-on-tertiary-fixed text-3xl" style="font-variation-settings: 'FILL' 1;">capture</span>
</div>
<p class="font-headline text-xl text-on-secondary-container text-center mb-8 font-bold">
                Don't hop away without saving your progress!
            </p>
<form class="space-y-6">
<!-- Input Group 1 -->
<div class="space-y-2">
<label class="font-label text-sm uppercase tracking-widest font-extrabold text-on-secondary-container ml-2">
                        Your Pond Email
                    </label>
<div class="relative">
<input class="w-full bg-surface-container-lowest sticker-border rounded-xl px-6 py-4 text-on-surface focus:ring-4 focus:ring-primary focus:outline-none placeholder:text-outline-variant font-medium transition-all" placeholder="frog@lilypad.com" type="email"/>
</div>
</div>
<!-- Input Group 2 -->
<div class="space-y-2">
<label class="font-label text-sm uppercase tracking-widest font-extrabold text-on-secondary-container ml-2">
                        Secret Toad Name
                    </label>
<div class="relative">
<input class="w-full bg-surface-container-lowest sticker-border rounded-xl px-6 py-4 text-on-surface focus:ring-4 focus:ring-primary focus:outline-none placeholder:text-outline-variant font-medium transition-all" placeholder="e.g. Sir Hopsalot" type="text"/>
</div>
</div>
<!-- Action Button -->
<button class="group w-full bg-primary text-on-primary font-headline text-xl font-black py-5 rounded-xl sticker-border zine-shadow hover:rotate-2 hover:-translate-y-1 transition-all flex items-center justify-center gap-3 mt-8" type="submit">
<span>Save My Hunt</span>
<span class="material-symbols-outlined group-hover:animate-bounce">
                        east
                    </span>
</button>
</form>
<!-- Close/Back Action (Suppresses Shell) -->
<div class="mt-8 text-center">
<button class="font-label text-xs uppercase tracking-widest font-bold text-on-secondary-container opacity-60 hover:opacity-100 transition-opacity flex items-center justify-center gap-2 mx-auto">
<span class="material-symbols-outlined text-sm">close</span>
                    I'll risk my lilypad
                </button>
</div>
</div>
<!-- Decorative Footer Element -->
<div class="mt-12 flex gap-4 overflow-hidden">
<div class="bg-tertiary-container text-on-tertiary-container px-4 py-2 rounded-full sticker-border -rotate-3 font-bold text-sm">
                No Spies Allowed
            </div>
<div class="bg-primary-container text-on-primary-container px-4 py-2 rounded-full sticker-border rotate-2 font-bold text-sm">
                100% Organic
            </div>
<div class="bg-secondary-container text-on-secondary-container px-4 py-2 rounded-full sticker-border -rotate-1 font-bold text-sm">
                Safe &amp; Snug
            </div>
</div>
</main>
<!-- BottomNavBar suppressed for Transactional Flow (Signup) -->
</body></html>
